<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="A request with a key and a local path reaches the guard and continues with placeholders, while a request with an identity number is stopped before the gateway">
  <defs>
    <linearGradient id="sgBg" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef2f9"/>
    </linearGradient>
    <linearGradient id="sgShield2" x1="320" y1="86" x2="320" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#2f5fd0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="300" fill="url(#sgBg)"/>

  <!-- incoming requests -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="32" y="52" width="196" height="72" rx="10" fill="#ffffff" stroke="#d6dfec"/>
    <rect x="48" y="70" width="96" height="8" rx="4" fill="#c3cddd"/>
    <rect x="48" y="88" width="152" height="8" rx="4" fill="#e2574c"/>
    <rect x="48" y="106" width="120" height="8" rx="4" fill="#e2574c"/>

    <rect x="32" y="176" width="196" height="72" rx="10" fill="#ffffff" stroke="#d6dfec"/>
    <rect x="48" y="194" width="80" height="8" rx="4" fill="#c3cddd"/>
    <rect x="48" y="212" width="164" height="8" rx="4" fill="#e2574c"/>
    <rect x="48" y="230" width="110" height="8" rx="4" fill="#e2574c"/>
  </g>

  <!-- guard shield -->
  <path d="M320 60 392 86v58c0 44-30 75-72 92-42-17-72-48-72-92V86Z" fill="url(#sgShield2)"/>
  <path d="M320 74 380 95v49c0 36-24 61-60 76-36-15-60-40-60-76V95Z" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="284" y="124" width="72" height="12" rx="6" fill="#ffffff"/>
  <rect x="284" y="148" width="46" height="12" rx="6" fill="#ffffff" fill-opacity="0.7"/>

  <!-- masked output -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="452" y="52" width="156" height="72" rx="10" fill="#ffffff" stroke="#9fc0f5"/>
    <rect x="468" y="70" width="72" height="8" rx="4" fill="#c3cddd"/>
    <rect x="468" y="88" width="124" height="8" rx="4" fill="#3f7ce0"/>
    <rect x="468" y="106" width="100" height="8" rx="4" fill="#3f7ce0"/>

    <rect x="452" y="176" width="156" height="72" rx="10" fill="#fdf1f0" stroke="#e2574c"/>
    <rect x="468" y="194" width="60" height="8" rx="4" fill="#c3cddd"/>
    <rect x="468" y="212" width="118" height="8" rx="4" fill="#e2574c"/>
    <rect x="468" y="230" width="84" height="8" rx="4" fill="#e2574c"/>
  </g>

  <!-- flow arrows -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="3">
    <path d="M232 88h36" stroke="#9aa9bd"/>
    <path d="M262 82l8 6-8 6" stroke="#9aa9bd"/>
    <path d="M232 212h36" stroke="#9aa9bd"/>
    <path d="M262 206l8 6-8 6" stroke="#9aa9bd"/>

    <path d="M396 88h50" stroke="#3f7ce0"/>
    <path d="M438 82l8 6-8 6" stroke="#3f7ce0"/>

    <path d="M398 212h50" stroke="#e2574c"/>
    <path d="M404 200l-14 12 14 12" stroke="#e2574c"/>
  </g>
</svg>
