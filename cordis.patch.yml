- insert:
    - id: sensitive-guard
      name: 'dsh-sensitive-guard'
      config:
        enabled: true
        # 閻犲鍟抽惁顖炲籍娴ｇ晫鐔呴柨娑欘劗rue 闁哄啯鍎奸悜锔芥交閸パ冨伎闂侇喓鍔嶉ˉ鍛圭€ｅ墎绀夊ù鐘叉噽閺併倖绂嶆惔銈囨閻?        bypassSanitize: false
        # 婵烇絽鍢查幃搴ㄥ棘閸ャ劍鎷遍柨娑欘劗rue 闁哄啳娉涜ぐ褍銆掗崨瀛樼彑闁轰礁绻戦崝鍛存偋閸ヮ煈鍞介柨娑樼墕缂嶅宕滃澶屽笡閻犱降鍊曢崙锟犲箰婢跺顏告繛鍙夘殔閻ゅ嫰鎮崇敮顔剧
        partialBlock: false
        # HTTP 闁告挸绉堕悿鍡涘箯閿旇棄鐒婚柨娑欒壘濠€顏堝及鎼淬垺鐎弶鈺傜☉閸?inbox 濞戞柨顑呮晶鐘诲绩閻熸澘鏅搁悹鍥敱閻増鎷呴幘鎵佸亾?        # 閺夆晜鐟﹀Σ鎼佸船椤栨瑧顏遍柤鍏呯矙濡棗顫㈤姀鈩冾潠闁哄倸娲╃换?inbox 闁汇劌瀚紞鍛磾椤曞棛绀夊鎯扮簿鐟欙箓宕￠搹顐ｆ澒閻炴稑琚埀?        interceptPromptBody: true
        # 閻犲洤锕ラ弻鍥晬濮樻剚鍞剁憸鐗堟礃閻︹剝绋夐鍕厒閺?connection/request 闁汇劌瀚顒€效閸岋妇绀夌痪顓у枦椤撶粯瀵奸悩铏圭炕闂侇偅宀告禍?        diagnoseTransport: true
        blockBypass: true

        # 闁告瑥鑻幃婊堝箥椤愶絽浼?        maskUserMessages: true
        maskToolResults: true
        maskResponses: false
        maskSubagentReturns: true
        auditRequests: true

        # 閻犲洤妫楅崺鍡楊嚕閳ь剟宕?        detectHighEntropy: false
        detectAddresses: true
        detectMedical: true
        detectQr: true
        detectBase64: false
        detectBypass: true
        markBinary: true
        maskDbCredentials: true
        maskPublicKeys: false

        # URL 闁告帒妫涙鍥晬濮濈嚰lse | internal | all
        maskUrls: false

        # 闁哄啨鍎辩换鏃€绋夋惔鈩冨暈閻犫偓?        logMasks: true
        logFormat: json
        highRiskAlertAfter: 6
        perSessionStats: true

        # 闁搞儱澧芥晶?        maxImagesPerTurn: 3
        ocr: true
        ocrMode: local
        imageBackend: auto
        ocrLanguage: zh-Hans-CN
        tesseractLanguage: chi_sim+eng
        ocrTimeoutMs: 20000
        ocrMaxImagesPerTurn: 3
        redactImages: true
        redactColor: '#000000'
        compressImages: true
        compressMaxDimension: 2048

        # 濞村吋淇洪惁鑺ョ▔鐎涙ɑ顦ч柣褑妫勯幃鏇㈠础閺囶亞绀勯悹鍥跺灠閸ㄤ粙宕橀崨顓у晣闁挎稑鑻紞瀣礈瀹ュ嫮绐楅悹鍥ㄧ箑缁楀宕樺鍫濆闁轰礁楠忕槐?        sessionWhitelist: []
        # 闁稿繈鍔岄惇顒€顫濋梹鎰暯闁谎嗘閹洟宕?        globalWhitelist: []
