- insert:
    - id: sensitive-guard
      name: 'dsh-sensitive-guard'
      config:
        enabled: true
        # 鐠嬪啳鐦弮浣界熅閿涙rue 閺冩儼鐑︽潻鍥у弿闁劍顥呭ù瀣剁礉娴犲懐鏁ゆ禍搴ょ殶鐠?        bypassSanitize: false
        # 濞ｅ嘲鎮庨弬鍥ㄦ拱閿涙rue 閺冭泛褰у〒鍛存珟閺佸繑鍔呴悧鍥唽閿涘牆缍嬮崜宥夌帛鐠併倕鍑￠幐澶嬬濞叉鐤勯悳甯礆
        partialBlock: false
        # HTTP 閸撳秶鐤嗛幏锔藉焻閿涙艾婀弰搴㈡瀮鏉╂稑鍙?inbox 娑斿澧犻弨鐟板晸鐠囬攱鐪版担鎾扁偓?        # 鏉╂瑦妲搁崬顖欑閼充粙妯嗗銏℃閺傚洩绻?inbox 閻ㄥ嫪缍呯純顕嗙礉婢惰精瑙﹂崡铏杹鐞涘被鈧?        interceptPromptBody: true
        # 鐠囧﹥鏌囬敍姘愁唶瑜版洘鐦℃稉顏勫煂鏉?connection/request 閻ㄥ嫯顕Ч鍌︾礉绾喛顓绘导鐘虹翻闁岸浜?        diagnoseTransport: true
        blockBypass: true

        # 閸欏苯鎮滈幍顐ｅ伎
        maskUserMessages: true
        maskToolResults: true
        maskResponses: false
        maskSubagentReturns: true
        auditRequests: true

        # 鐠囧棗鍩嗗鈧崗?        detectHighEntropy: true
        detectAddresses: true
        detectMedical: true
        detectQr: true
        detectBase64: false
        detectBypass: true
        markBinary: true
        maskDbCredentials: true
        maskPublicKeys: false

        # URL 閸掑棛楠囬敍姝燼lse | internal | all
        maskUrls: false

        # 閺冦儱绻旀稉搴℃啞鐠€?        logMasks: true
        logFormat: json
        highRiskAlertAfter: 6
        perSessionStats: true

        # 閸ュ墽澧?        maxImagesPerTurn: 3
        ocr: true
        ocrMode: local
        imageBackend: auto
        ocrLanguage: zh-Hans-CN
        tesseractLanguage: chi_sim+eng
        ocrTimeoutMs: 20000
        ocrMaxImagesPerTurn: 3
        redactImages: true
        redactColor: '#000000'
        compressImages: true
        compressMaxDimension: 2048

        # 娴兼俺鐦芥稉瀛樻閻ц棄鎮曢崡鏇礄鐠囶垰鍨介崘鍛啇閿涘苯缍嬮崜宥勭窗鐠囨繀绗夐崘宥堝姎閺佸骏绱?        sessionWhitelist: []
        # 閸忋劌鐪闀愮畽閻ц棄鎮曢崡?        globalWhitelist: []
